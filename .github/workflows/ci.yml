name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  ghost:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [ghost:5-alpine, ghost:6-alpine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Real Ghost in Docker, checked in Chromium
        run: GHOST_IMAGE=${{ matrix.image }} sh test/e2e/run.sh
